name: Evaluation tools
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s test -v
      - run: python3 -m py_compile tools/*.py tools/jlse/*.py
      - run: bash -n tools/jlse/*.sh tools/build_paper.sh
